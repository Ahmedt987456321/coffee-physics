<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Coffee Physics: science for everyday things. Know exactly when your coffee will be perfect to drink.">
<title>Coffee Physics</title>
<style>
  :root{
    --ink:#3b3a37; --mid:#6c6a66; --dim:#8f8d88; --faint:#b3b0aa;
    --accent:#4b4945; --line:rgba(60,58,54,.14);
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 90% at 50% 0%, #eceae7 0%, #e2e0dc 45%, #d7d5d1 100%);
    display:flex; align-items:center; justify-content:center; padding:32px;
  }
  .stage{max-width:560px; width:100%; text-align:center}
  .mark{
    width:64px; height:64px; margin:0 auto 26px; border-radius:50%;
    background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.7);
    box-shadow:0 10px 30px rgba(60,48,34,.12); display:grid; place-items:center;
  }
  .mark span{display:block; width:26px; height:20px; border:2px solid var(--accent);
    border-radius:0 0 12px 12px; border-top:0; position:relative}
  .mark span::before{content:""; position:absolute; right:-9px; top:1px; width:9px; height:10px;
    border:2px solid var(--accent); border-left:0; border-radius:0 8px 8px 0}
  .mark span::after{content:""; position:absolute; left:5px; top:-11px; width:2px; height:7px;
    background:var(--faint); box-shadow:6px 0 0 var(--faint), 12px 0 0 var(--faint); border-radius:2px}

  h1{font-size:clamp(38px,7vw,60px); font-weight:600; letter-spacing:-.02em; margin:0; line-height:1.02}
  h1 em{font-style:normal; color:var(--mid)}
  .tag{margin:14px 0 0; font-size:clamp(15px,2.4vw,19px); color:var(--mid); letter-spacing:.01em}
  .sub{margin:22px auto 0; max-width:38ch; font-size:15px; line-height:1.6; color:var(--dim)}
  .cta{
    display:inline-flex; align-items:center; gap:9px; margin-top:34px;
    font-size:15px; font-weight:600; color:#f7f6f4; background:var(--accent);
    text-decoration:none; padding:14px 26px; border-radius:14px;
    box-shadow:0 8px 22px rgba(60,48,34,.18); transition:transform .15s, background .15s;
  }
  .cta:hover{background:#3b3935; transform:translateY(-1px)}
  .cta svg{width:16px; height:16px}
  .foot{margin-top:40px; font-size:12px; color:var(--faint)}
  .foot a{color:var(--faint)}
</style>
</head>
<body>
  <main class="stage">
    <div class="mark" aria-hidden="true"><span></span></div>
    <h1>Coffee<em> Physics</em></h1>
    <p class="tag">science for everyday things</p>
    <p class="sub">Watch a real cup cool in real time, and know exactly when it will be perfect to drink.</p>
    <a class="cta" href="app.html">
      Open Coffee Physics
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="foot">Real cooling physics, no jargon. Photo: &ldquo;Coffee Cup on Modern Table&rdquo; (CC0).</p>
  </main>
</body>
</html>
