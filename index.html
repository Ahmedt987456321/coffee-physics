<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="description" content="Coffee Physics: see how your coffee cools and when it is perfect to drink.">
<title>Coffee Physics</title>
<style>
  :root{
    --ink:#3b3a37; --mid:#6c6a66; --dim:#8f8d88; --faint:#b3b0aa;
    --accent:#4b4945; --hair:rgba(60,58,54,.14);
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 90% at 50% 0%, #eceae7, #ddd9d2 70%, #d3cfc9);
    display:flex; align-items:center; justify-content:center; padding:22px}
  img{max-width:100%}
  [hidden]{display:none!important}

  .frame{position:relative; line-height:0}
  .frame img{display:block; max-height:88vh; width:auto; max-width:100%; border-radius:20px; box-shadow:0 22px 54px rgba(50,42,30,.22)}
  .frame canvas#steam{position:absolute; inset:0; width:100%; height:100%; border-radius:20px}

  .brandmark{position:absolute; left:20px; top:18px; font-weight:600; font-size:16px; letter-spacing:-.01em; color:var(--ink); text-shadow:0 1px 10px rgba(255,255,255,.6); line-height:1}
  .brandmark em{font-style:normal; color:var(--mid)}

  .readout{position:absolute; right:20px; top:16px; text-align:right; line-height:1}
  .readout .t{font-weight:200; font-size:clamp(40px,4.4vw,56px); letter-spacing:-.03em; font-variant-numeric:tabular-nums; text-shadow:0 2px 22px rgba(255,255,255,.5)}
  .readout .t sup{font-size:.34em; font-weight:400; color:var(--mid); vertical-align:super; top:-.7em}
  .readout .sub{font-size:12px; color:var(--mid); margin-top:7px}
  .edit{font:inherit; color:var(--ink); background:none; border:0; padding:0 0 1px; cursor:pointer; border-bottom:1px dashed var(--faint)}
  .edit:hover{border-bottom-color:var(--mid)}
  .editbig{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; line-height:1; border-bottom:1px dashed var(--faint)}
  .editbig:hover{border-bottom-color:var(--mid)}

  /* small transparent cooling graph, beneath the cup */
  .minigraph{position:absolute; left:50%; transform:translateX(-50%); bottom:130px; width:min(72%,380px); text-align:center}
  #chart{width:100%; height:100px; display:block}
  .miniwin{margin:6px 2px 0; font-size:12px; line-height:1.4; color:#000; text-align:center; text-shadow:0 1px 8px rgba(255,255,255,.98),0 0 14px rgba(255,255,255,.95)}
  .miniwin b{font-weight:600}
  .minihead{margin:0 2px 3px; font-size:11px; color:#000; text-align:center; letter-spacing:.02em; text-shadow:0 1px 8px rgba(255,255,255,.98),0 0 14px rgba(255,255,255,.95)}

  .pop{position:absolute; right:16px; top:78px; z-index:5; background:transparent; padding:0; text-align:right; width:min(320px,74vw)}
  .seg{display:flex; gap:6px; justify-content:flex-end}
  .seg.fill{justify-content:space-between; width:100%}
  .seg button{font-family:var(--body); font-size:12.5px; padding:6px 9px; background:transparent; border:0; color:var(--mid); text-shadow:0 1px 7px rgba(255,255,255,.9); border-radius:8px; cursor:pointer}
  .seg button[aria-pressed="true"]{color:var(--ink); font-weight:700; background:rgba(255,255,255,.4)}
  .pop .why{margin-top:9px; font-size:11.5px; line-height:1.55; color:var(--ink); text-shadow:0 1px 8px rgba(255,255,255,.98),0 0 14px rgba(255,255,255,.85)}
  .poplabel{display:block; font-size:12px; color:var(--ink); margin-bottom:8px; text-shadow:0 1px 7px rgba(255,255,255,.85)}
  input[type=range]{-webkit-appearance:none; width:100%; height:3px; background:rgba(90,84,76,.3); border-radius:3px; outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.25); border:2px solid #fff}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}

  .cuphit{position:absolute; left:40%; top:40%; width:22%; height:25%; background:none; border:0; cursor:pointer; border-radius:50%}
  .cuphit:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .taphint{position:absolute; left:50%; bottom:24%; transform:translateX(-50%); font-family:var(--body); font-size:13px; font-weight:500; color:var(--mid); pointer-events:none; text-shadow:0 1px 7px rgba(255,255,255,.75)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <button class="cuphit" id="cupHit" aria-label="Show how the coffee cools"></button>
    <div class="taphint" id="tapHint">tap the cup</div>
  </div>

<script>
"use strict";
const P={SIGMA:5.670374419e-8,R:8.314462,M:0.018015,C:4186,RHO:1000,L:2.26e6,EPS:0.95,RHO_A:1.2,CP_A:1006,LE:0.85,RH:0.5,DIAM:0.08};
const MAT_H={ceramic:10,glass:12,metal:18,insulated:3.4};
const MAT_WHY={ceramic:"Ceramic holds heat moderately, the everyday cup.",glass:"Glass loses heat a little faster than ceramic.",metal:"Bare metal conducts heat away fast, so it cools quickly.",insulated:"An insulated travel mug has a vacuum wall, so it stays hot far longer."};
const MILK={
  whole:{maxHeat:70,desc:"rich and creamy",breaks:"skins"},
  skim:{maxHeat:70,desc:"light, froths well",breaks:"scalds"},
  oat:{maxHeat:65,desc:"smooth, plant-based",breaks:"splits"},
  almond:{maxHeat:65,desc:"thin, plant-based",breaks:"curdles"},
  soya:{maxHeat:70,desc:"protein-rich",breaks:"curdles"}
};
function milkInfo(mk){const m=MILK[mk],cap=mk[0].toUpperCase()+mk.slice(1);
  return `<b>${cap} milk</b> &middot; ${m.desc}. Max <b>${m.maxHeat}°</b> before it ${m.breaks}.`;}
const DRINK_LO=55, DRINK_HI=65, DUR=1800;
const psatPa=t=>1000*0.61078*Math.exp(17.27*t/(t+237.3));
const rhoVap=t=>psatPa(t)*P.M/(P.R*(t+273.15));
function geom(v){const r=P.DIAM/2,aTop=Math.PI*r*r,vM3=v*1e-6,h=vM3/aTop;return{aTop,aSide:Math.PI*P.DIAM*h,mass:P.RHO*vM3};}
function flows(T,tRoom,v){
  const g=geom(v),h=MAT_H[cfg.material]||10,aTopEff=g.aTop,dT=Math.max(T-tRoom,0);
  const conv=h*(g.aSide+aTopEff)*dT;
  const tk=T+273.15,trk=tRoom+273.15,rad=P.EPS*P.SIGMA*(g.aSide+aTopEff)*Math.max(tk**4-trk**4,0);
  const hM=h/(P.RHO_A*P.CP_A*Math.pow(P.LE,2/3)),drive=Math.max(rhoVap(T)-P.RH*rhoVap(tRoom),0);
  const evap=P.L*hM*g.aTop*drive;
  return{total:conv+rad+evap,mass:g.mass};
}
const cfg={material:"ceramic",vol:250,t0:87,tr:21,milkType:"whole"};
let bl=null;
function baseline(){if(bl)return bl;let T=cfg.t0,v=cfg.vol,t=0;const out=[{t:0,T}],dt=15;
  while(t<DUR){const f=flows(T,cfg.tr,v);T+=-(f.total)/(f.mass*P.C)*dt;t+=dt;out.push({t,T});}bl=out;return out;}
function drinkWindow(){const b=baseline();let ready=null,cold=null;for(const p of b){if(ready===null&&p.T<=DRINK_HI)ready=p.t;if(ready!==null&&cold===null&&p.T<DRINK_LO){cold=p.t;break;}}return{ready,cold};}
function refresh(){bl=null;}

const $=id=>document.getElementById(id);
const steamC=$("steam"),sx=steamC.getContext("2d"),chC=$("chart"),chX=chC.getContext("2d");
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);c.getContext("2d").setTransform(d,0,0,d,0,0);return r;}
let stR=fit(steamC),chR=fit(chC);
function refit(){stR=fit(steamC);chR=fit(chC);}
const photo=$("photo"); photo.complete?refit():photo.addEventListener("load",refit);
window.addEventListener("resize",refit); setTimeout(refit,80);

function tempColor(T){const s=[[28,[176,173,168]],[50,[150,148,143]],[68,[110,108,103]],[88,[70,68,63]]];
  if(T<=s[0][0])return`rgb(${s[0][1]})`; if(T>=s[3][0])return`rgb(${s[3][1]})`;
  for(let i=0;i<3;i++)if(T<=s[i+1][0]){const f=(T-s[i][0])/(s[i+1][0]-s[i][0]);return`rgb(${s[i][1].map((v,j)=>Math.round(v+(s[i+1][1][j]-v)*f))})`;}}
const CX=0.51,CY=0.47,RX=0.08;
function drawSteam(ms){
  const W=stR.width,H=stR.height,x=sx;x.clearRect(0,0,W,H);
  const cupW=RX*W*2,bx0=CX*W,by=0.435*H,n=3,unit=cupW*0.17;
  for(let p=0;p<n;p++){const bx=bx0+(p-(n-1)/2)*(cupW*0.34),seed=p*10.7;
    for(let layer=0;layer<2;layer++){x.beginPath();
      for(let i=0;i<=14;i++){const yy=by-i*unit,ph=ms*0.00015+i*0.33+seed,sway=Math.sin(ph)*(cupW*0.06+i*cupW*0.02)+Math.sin(ph*1.9+seed)*cupW*0.04;i?x.lineTo(bx+sway,yy):x.moveTo(bx+sway,yy);}
      x.strokeStyle=`rgba(255,255,255,${layer?0.04:0.06})`;x.lineWidth=layer?cupW*0.5:cupW*0.26;x.lineCap="round";x.shadowColor="rgba(255,255,255,.5)";x.shadowBlur=cupW*0.4;x.stroke();}}
  x.shadowBlur=0;
}
function drawChart(){
  const W=chR.width,H=chR.height,x=chX;x.clearRect(0,0,W,H);
  const mL=10,mR=10,mT=12,mB=20,pw=W-mL-mR,ph=H-mT-mB;
  const tmax=DUR/60,ymin=40,ymax=Math.max(92,cfg.t0+3);
  const X=t=>mL+(t/tmax)*pw,Y=v=>mT+(1-(v-ymin)/(ymax-ymin))*ph;
  const b=baseline(),w=drinkWindow();
  // the "just right" band is the answer the chart exists to give
  x.fillStyle="rgba(60,58,54,.11)";x.fillRect(mL,Y(DRINK_HI),pw,Y(DRINK_LO)-Y(DRINK_HI));
  x.save();x.shadowColor="rgba(255,255,255,.95)";x.shadowBlur=4;
  x.fillStyle="#000";x.font="10px system-ui,sans-serif";x.textAlign="left";x.textBaseline="middle";
  x.fillText("just right  "+DRINK_LO+"-"+DRINK_HI+"°",mL+4,(Y(DRINK_HI)+Y(DRINK_LO))/2);x.restore();
  // full cooling curve, faint
  x.strokeStyle="rgba(92,90,85,.42)";x.lineWidth=2;x.lineJoin="round";x.lineCap="round";x.beginPath();
  b.forEach((p,i)=>{const xx=X(p.t/60),yy=Y(p.T);i?x.lineTo(xx,yy):x.moveTo(xx,yy);});x.stroke();
  // the stretch when it is good to drink, bold
  if(w.ready!=null){x.strokeStyle="#3b3a37";x.lineWidth=3.2;x.beginPath();let on=false;
    for(const p of b){if(p.t>=w.ready&&(w.cold==null||p.t<=w.cold)){const xx=X(p.t/60),yy=Y(p.T);on?x.lineTo(xx,yy):x.moveTo(xx,yy);on=true;}}x.stroke();}
  // where it becomes ready and where it goes cold
  const mark=(t,Tv,label,align)=>{if(t==null)return;const xx=X(t/60),yy=Y(Tv);
    x.beginPath();x.arc(xx,yy,3.4,0,7);x.fillStyle="#000";x.fill();x.strokeStyle="#fff";x.lineWidth=1.3;x.stroke();
    x.save();x.shadowColor="rgba(255,255,255,.95)";x.shadowBlur=4;
    x.font="600 10px system-ui,sans-serif";x.fillStyle="#000";x.textBaseline="bottom";x.textAlign=align;
    x.fillText(label,align==="left"?xx+6:xx-6,yy-5);x.restore();};
  mark(w.ready,DRINK_HI,"ready","left");
  mark(w.cold,DRINK_LO,"cold","right");
  // your coffee, right now: anchors the temperature axis
  {const xx=X(0),yy=Y(cfg.t0);
   x.beginPath();x.arc(xx,yy,3.4,0,7);x.fillStyle="#000";x.fill();x.strokeStyle="#fff";x.lineWidth=1.3;x.stroke();
   x.save();x.shadowColor="rgba(255,255,255,.95)";x.shadowBlur=4;
   x.font="600 10px system-ui,sans-serif";x.fillStyle="#000";x.textAlign="left";x.textBaseline="bottom";
   x.fillText(Math.round(cfg.t0)+"°",xx+6,yy-5);x.restore();}
  // time axis
  x.save();x.shadowColor="rgba(255,255,255,.95)";x.shadowBlur=4;
  x.fillStyle="#000";x.font="10px system-ui,sans-serif";x.textBaseline="top";
  x.textAlign="left";x.fillText("now",X(0),H-mB+4);
  x.textAlign="right";x.fillText("30 min",X(tmax),H-mB+4);x.restore();
}
function updateWin(){const w=drinkWindow();
  $("win").innerHTML = w.ready==null ? "Still too hot after 30 minutes."
    : `Perfect to drink in <b>${Math.round(w.ready/60)} min</b>`+(w.cold!=null?`, good until <b>${Math.round(w.cold/60)} min</b>.`:".");}

let graphOn=false;
function render(ms){
  drawSteam(ms);
  $("tempVal").textContent=Math.round(cfg.t0); $("tempVal").parentElement.style.color=tempColor(cfg.t0);
  $("editCup").textContent=cfg.material; $("editVol").textContent=cfg.vol+" mL"; $("editMilk").textContent=cfg.milkType+" milk";
  if(graphOn){drawChart();}
  requestAnimationFrame(render);
}

// pickers
function togglePop(id){["popCup","popVol","popMilk","popTemp"].forEach(p=>{if(p!==id)$(p).hidden=true;});$(id).hidden=!$(id).hidden;}
$("editTemp").onclick=e=>{e.stopPropagation();$("temp").value=Math.round(cfg.t0);togglePop("popTemp");};
$("editCup").onclick=e=>{e.stopPropagation();togglePop("popCup");};
$("editVol").onclick=e=>{e.stopPropagation();togglePop("popVol");};
$("editMilk").onclick=e=>{e.stopPropagation();togglePop("popMilk");$("milkWhy").innerHTML=milkInfo(cfg.milkType);};
document.addEventListener("click",e=>{if(!e.target.closest(".pop")&&!e.target.closest(".edit")&&!e.target.closest(".editbig")){$("popCup").hidden=true;$("popVol").hidden=true;$("popMilk").hidden=true;$("popTemp").hidden=true;}});

document.querySelectorAll("#matSeg button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll("#matSeg button").forEach(z=>z.setAttribute("aria-pressed",false));b.setAttribute("aria-pressed",true);cfg.material=b.dataset.mat;$("matWhy").textContent=MAT_WHY[cfg.material];$("popCup").hidden=true;refresh();updateWin();};
  b.addEventListener("mouseenter",()=>{$("matWhy").textContent=MAT_WHY[b.dataset.mat];});
});
$("matSeg").addEventListener("mouseleave",()=>{$("matWhy").textContent=MAT_WHY[cfg.material];});
document.querySelectorAll("#milkTypeSeg button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll("#milkTypeSeg button").forEach(z=>z.setAttribute("aria-pressed",false));b.setAttribute("aria-pressed",true);cfg.milkType=b.dataset.mk;$("milkWhy").innerHTML=milkInfo(cfg.milkType);};
  b.addEventListener("mouseenter",()=>{$("milkWhy").innerHTML=milkInfo(b.dataset.mk);});
});
$("milkTypeSeg").addEventListener("mouseleave",()=>{$("milkWhy").innerHTML=milkInfo(cfg.milkType);});
$("temp").oninput=e=>{cfg.t0=+e.target.value;refresh();updateWin();};
$("vol").oninput=e=>{cfg.vol=+e.target.value;refresh();updateWin();};

// tap the cup -> small graph
$("cupHit").onclick=()=>{graphOn=!graphOn;$("miniGraph").hidden=!graphOn;$("tapHint").hidden=graphOn;if(graphOn){refit();updateWin();}};

// quietly use the local temperature as the room the coffee cools toward
(function(){ if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async pos=>{ try{
    const{latitude:la,longitude:lo}=pos.coords;
    const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m`)).json();
    cfg.tr=Math.round(d.current.temperature_2m); P.RH=Math.max(0,Math.min(1,d.current.relative_humidity_2m/100)); refresh(); updateWin();
  }catch(_){} }, ()=>{}); })();

updateWin(); requestAnimationFrame(render);
</script>
</body>
</html>
